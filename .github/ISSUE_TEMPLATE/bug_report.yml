name: Bug report
description: Report a reproducible problem without sharing credentials or personal data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never attach `auth.json`, `*.auth.dpapi`, tokens, account IDs, email addresses, or unredacted logs. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: Commit SHA or release version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, Codex version, and .NET SDK/runtime version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or fully redacted data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, tokens, account identifiers, email addresses, and personal paths.
          required: true

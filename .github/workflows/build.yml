name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\CodexAccountSwitcher.sln

      - name: Build
        run: dotnet build .\CodexAccountSwitcher.sln -c Release --no-restore -warnaserror

      - name: Run deterministic tests
        run: dotnet run --project .\tests\CodexAccountSwitcher.Tests\CodexAccountSwitcher.Tests.csproj -c Release --no-build

      - name: Verify publish
        run: >-
          dotnet publish .\src\CodexAccountSwitcher\CodexAccountSwitcher.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\artifacts\win-x64
